name: Synthetic control revalidation
on:
  pull_request:
    paths:
      - 'examples/control-revalidation/**'
      - 'examples/retention-evidence-intake/**'
      - 'tests/**'
      - 'docs/REGULATORY_CONTROL_EVIDENCE_MAPPING_2026-10-29.ja.md'
      - '.github/workflows/control-revalidation.yml'
  push:
    branches: [main]
    paths:
      - 'examples/control-revalidation/**'
      - 'examples/retention-evidence-intake/**'
      - 'tests/**'
      - 'docs/REGULATORY_CONTROL_EVIDENCE_MAPPING_2026-10-29.ja.md'
      - '.github/workflows/control-revalidation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test state and existing site regressions
        run: |
          python3 -I -m unittest discover -s tests
          node --test examples/control-revalidation/demo.test.mjs > demo-tests.tap
          node examples/control-revalidation/demo.mjs > regenerated.json
          node examples/control-revalidation/demo.mjs > regenerated-again.json
          cmp regenerated.json regenerated-again.json
      - name: Archive reproduction input and results
        run: |
          mkdir -p reproduction
          git rev-parse HEAD > reproduction/SOURCE_COMMIT.txt
          node --version > reproduction/NODE_VERSION.txt
          cp demo-tests.tap regenerated.json reproduction/
          git archive --format=zip --prefix=evidect-site/ HEAD > reproduction/source.zip
          sha256sum reproduction/source.zip reproduction/regenerated.json > reproduction/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-revalidation-${{ github.sha }}
          path: reproduction/
          retention-days: 30
          if-no-files-found: error
