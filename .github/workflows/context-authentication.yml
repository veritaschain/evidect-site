name: Observation baseline authentication
on:
  pull_request:
    paths:
      - 'tools/context-observer/**'
      - '.github/workflows/context-authentication.yml'
  push:
    branches: [main]
    paths:
      - 'tools/context-observer/**'
      - '.github/workflows/context-authentication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test actual signatures, pinned baseline and file collection
        shell: bash
        run: |
          mkdir -p authentication-results
          git rev-parse HEAD > authentication-results/SOURCE_COMMIT.txt
          python3 --version > authentication-results/ENVIRONMENT.txt
          node --version >> authentication-results/ENVIRONMENT.txt
          node --check tools/context-observer/receipt_crypto.mjs
          python3 -I -B tools/context-observer/test_authenticated.py -v 2>&1 | tee authentication-results/authentication.log
          python3 -I -B tools/context-observer/test_observe.py -v 2>&1 | tee authentication-results/observer.log
          node --test examples/control-revalidation/demo.test.mjs | tee authentication-results/synthetic.log
          python3 -I -B -m unittest discover -s tests -v 2>&1 | tee authentication-results/site.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: observation-authentication-${{ matrix.os }}-${{ github.run_id }}
          path: authentication-results/
          if-no-files-found: error
          retention-days: 30
