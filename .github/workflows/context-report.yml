name: Offline receiver report
on:
  pull_request:
    paths:
      - 'tools/context-observer/**'
      - '.github/workflows/context-report.yml'
  push:
    branches: [main]
    paths:
      - 'tools/context-observer/**'
      - '.github/workflows/context-report.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test offline reports and fail-closed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receiver-report-results
          git rev-parse HEAD > receiver-report-results/SOURCE_COMMIT.txt
          python3 --version > receiver-report-results/ENVIRONMENT.txt
          node --version >> receiver-report-results/ENVIRONMENT.txt
          python3 -I -B tools/context-observer/test_report.py -v 2>&1 | tee receiver-report-results/report.log
          python3 -I -B -m unittest discover -s tests -v 2>&1 | tee receiver-report-results/site.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: receiver-report-${{ matrix.os }}-${{ github.run_id }}
          path: receiver-report-results/
          if-no-files-found: error
          retention-days: 30
