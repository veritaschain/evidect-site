name: Offline runtime evidence handoff

on:
  pull_request:
    paths:
      - 'examples/runtime-boundaries/**'
      - 'examples/execution-authorization/**'
      - 'tools/context-observer/**'
      - '.github/workflows/runtime-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'examples/runtime-boundaries/**'
      - 'examples/execution-authorization/**'
      - 'tools/context-observer/**'
      - '.github/workflows/runtime-handoff.yml'

permissions:
  contents: read

concurrency:
  group: runtime-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  handoff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test original contracts, service routing, and the runtime receiver
        shell: bash
        env:
          RESULTS: ${{ runner.temp }}/evidect-runtime-handoff-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RESULTS"
          git rev-parse HEAD > "$RESULTS/source-commit.txt"
          python3 --version > "$RESULTS/environment.txt"
          node --version >> "$RESULTS/environment.txt"
          node --test --test-reporter=tap examples/execution-authorization/gate.test.mjs 2>&1 | tee "$RESULTS/gate-tests.tap"
          node --test --test-reporter=tap examples/execution-authorization/service-routing/routing.test.mjs 2>&1 | tee "$RESULTS/service-routing-tests.tap"
          node --test --test-reporter=tap examples/execution-authorization/service-routing/receiver.test.mjs 2>&1 | tee "$RESULTS/routing-receiver-tests.tap"
          node --test --test-reporter=tap examples/runtime-boundaries/boundary.test.mjs 2>&1 | tee "$RESULTS/boundary-tests.tap"
          python3 -I -B tools/context-observer/test_handoff.py -v 2>&1 | tee "$RESULTS/legacy-handoff-tests.log"
          python3 -I -B examples/runtime-boundaries/test_handoff.py -v 2>&1 | tee "$RESULTS/runtime-handoff-tests.log"
          python3 -I -B examples/execution-authorization/service-routing/test_handoff.py -v 2>&1 | tee "$RESULTS/routing-handoff-tests.log"
      - name: Check synthetic routing and retained receiver verification
        shell: bash
        env:
          RESULTS: ${{ runner.temp }}/evidect-runtime-handoff-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          node examples/execution-authorization/service-routing/demo.mjs > "$RESULTS/service-routing-report.json"
          python3 -I -B examples/runtime-boundaries/handoff_demo.py --output "$RESULTS/demo"
          python3 -I -B examples/execution-authorization/service-routing/handoff_demo.py --output "$RESULTS/routing-handoff"
          python3 -I -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          result_root = Path(os.environ['RESULTS'])
          routing_raw = (result_root / 'service-routing-report.json').read_bytes()
          if b'-----BEGIN PRIVATE KEY-----' in routing_raw or b'-----BEGIN ENCRYPTED PRIVATE KEY-----' in routing_raw:
              raise SystemExit('Private key material must not be retained')
          routing = json.loads(routing_raw)
          expected_cases = [
              ('dual-allow', 1, 1),
              ('service-missing', 0, 1),
              ('service-revoked-after-preview', 0, 1),
              ('user-revoked-after-preview', 0, 1),
              ('refusal-fallback-denied', 1, 2),
              ('refusal-fallback-authorized', 2, 2),
              ('refusal-non-ai-denied', 1, 2),
              ('refusal-non-ai-authorized', 2, 2),
              ('route-changed-after-approval', 0, 1),
              ('consumed-request-replay', 1, 2),
          ]
          if not (routing['format'] == 'evidect-service-routing-report/1'
                  and routing['test_result'] == 'PASS'
                  and routing['case_count'] == 10
                  and [case['case_id'] for case in routing['cases']] == [item[0] for item in expected_cases]):
              raise SystemExit('Unexpected service routing case set')
          for case, (_, calls, attempts) in zip(routing['cases'], expected_cases):
              if not (case['test_result'] == 'PASS'
                      and type(case['tool']['calls']) is int
                      and case['tool']['calls'] == calls
                      and len(case['tool']['markers']) == calls
                      and len(case['attempts']) == attempts):
                  raise SystemExit('Unexpected service routing tool state')
              for index, attempt in enumerate(case['attempts'], start=1):
                  delta = attempt['dispatch_delta']
                  if not (attempt['mode'] == 'EXECUTE'
                          and attempt['attempt_index'] == index
                          and type(delta['calls']) is int
                          and delta['calls'] in (0, 1)
                          and type(delta['marker_count']) is int
                          and delta['marker_count'] == delta['calls']):
                      raise SystemExit('Unexpected service routing attempt')
                  if delta['calls'] == 0:
                      if attempt['authorization'] != 'DENY' or attempt['synthetic_result'] != 'NOT_CALLED':
                          raise SystemExit('Undispatched attempt was reported as a model result')
                  elif not (attempt['authorization'] == 'ALLOW'
                            and attempt['service_permission']['status'] == 'ALLOW'
                            and attempt['gate_execution_recheck']['authorization'] == 'ALLOW'
                            and attempt['synthetic_result'] in ('REFUSED', 'COMPLETED')):
                      raise SystemExit('Unexpected dispatched result')
              if sum(attempt['dispatch_delta']['calls'] for attempt in case['attempts']) != calls:
                  raise SystemExit('Dispatch deltas do not match the toy tool')
              if case['case_id'].startswith('refusal-'):
                  if not (case['attempts'][0]['synthetic_result'] == 'REFUSED'
                          and case['attempts'][0]['dispatch_delta']['calls'] == 1
                          and case['attempts'][1]['synthetic_result'] == ('COMPLETED' if calls == 2 else 'NOT_CALLED')):
                      raise SystemExit('Synthetic refusal and continuation were conflated')
          for key in ('report_signed', 'production_observed', 'independent_assessment',
                      'runtime_attestation', 'external_anchor_verified'):
              if routing[key] is not False:
                  raise SystemExit('Unexpected service routing assurance claim')
          if routing['control_status'] != 'NOT_ASSESSED' or routing['legal_compliance'] != 'NOT_ASSESSED':
              raise SystemExit('Unexpected service routing assessment claim')

          def check_verification_context(directory, report, summary):
              checkpoint = json.loads((directory / 'test-trust/checkpoint.json').read_bytes())
              pin_bytes = json.dumps(checkpoint, sort_keys=True, separators=(',', ':'),
                                     ensure_ascii=True, allow_nan=False).encode('ascii')
              ver = report['verification']
              evaluated = ver['evaluated_at_unix']
              if not (type(evaluated) is int and
                      checkpoint['expires_at'] - 3600 <= evaluated < checkpoint['expires_at']):
                  raise SystemExit('Verification reference time is outside synthetic validity')
              expected = {
                  'evaluated_at_unix': evaluated, 'time_source': 'SYSTEM_CLOCK',
                  'clock': 'LOCAL_UNATTESTED',
                  'checkpoint_sha256': hashlib.sha256(pin_bytes).hexdigest(),
                  'checkpoint_digest_scope': 'CANONICAL_CHECKPOINT_JSON_NOT_TRUST_ANCHOR',
                  'checkpoint_expires_at_unix': checkpoint['expires_at'],
                  'result_scope': 'AS_OF_EVALUATION_TIME',
                  'refresh': 'REVERIFY_ORIGINAL_INPUTS_WITH_CURRENT_TRUST',
              }
              if ver != expected or summary['checkpoint_expires_at'] != checkpoint['expires_at']:
                  raise SystemExit('Saved receiver verification context does not match retained checkpoint')

          demo = result_root / 'demo'
          summary = json.loads((demo / 'summary.json').read_bytes())
          receiver = json.loads((demo / 'receiver.json').read_bytes())
          if summary.get('format') != 'evidect-runtime-handoff-demo/2' or summary.get('test_result') != 'PASS':
              raise SystemExit('Synthetic handoff did not complete successfully')
          if not (receiver['format'] == 'evidect-runtime-receiver/2'
                  and receiver['local_status'] == 'VALID'
                  and receiver['overall_status'] == 'INDETERMINATE'
                  and receiver['content_binding']['status'] == 'VALID'
                  and receiver['runtime']['status'] == 'RECOMPUTED'
                  and receiver['runtime']['claimed_summaries_match'] is True
                  and len(receiver['runtime']['cases']) == 8):
              raise SystemExit('Unexpected receiver result')
          check_verification_context(demo, receiver, summary)
          expected_runtime_checks = {
              'sender_removed_before_verification': True, 'private_key_in_output': False,
              'fixed_eight_cases_recomputed': True, 'verification_context_recorded': True,
              'repeated_verification_evidence_matches': True,
              'missing_trust_not_adopted': True, 'changed_bytes_rejected': True,
          }
          if summary['checks'] != expected_runtime_checks:
              raise SystemExit('Saved runtime demo checks changed')
          for key in ('report_signed', 'production_observed', 'independent_assessment',
                      'runtime_attestation', 'external_anchor_verified'):
              if receiver[key] is not False:
                  raise SystemExit('Unexpected assurance claim')
          if receiver['control_status'] != 'NOT_ASSESSED' or receiver['legal_compliance'] != 'NOT_ASSESSED':
              raise SystemExit('Unexpected assessment claim')

          routing_demo = result_root / 'routing-handoff'
          routing_summary = json.loads((routing_demo / 'summary.json').read_bytes())
          routing_receiver = json.loads((routing_demo / 'receiver.json').read_bytes())
          saved_routing_raw = (routing_demo / 'delivery/service-routing-report.json').read_bytes()
          saved_package_raw = (routing_demo / 'delivery/observation.handoff.json').read_bytes()
          if not (routing_summary['format'] == 'evidect-service-routing-handoff-demo/2'
                  and routing_summary['test_result'] == 'PASS'
                  and routing_summary['routing_report_sha256'] == hashlib.sha256(saved_routing_raw).hexdigest()
                  and routing_summary['handoff_package_sha256'] == hashlib.sha256(saved_package_raw).hexdigest()):
              raise SystemExit('Unexpected saved routing summary')
          expected_demo_checks = {
              'sender_removed_before_verification': True, 'private_key_in_output': False,
              'fixed_ten_cases_consistent': True, 'fixed_fixture_expectations_matched': True,
              'verification_context_recorded': True,
              'repeated_verification_evidence_matches': True, 'missing_trust_not_adopted': True,
              'changed_bytes_rejected': True,
          }
          if routing_summary['checks'] != expected_demo_checks:
              raise SystemExit('Saved routing demo checks changed')
          check_verification_context(routing_demo, routing_receiver, routing_summary)
          if not (routing_receiver['format'] == 'evidect-service-routing-receiver/2'
                  and routing_receiver['local_status'] == 'VALID'
                  and routing_receiver['overall_status'] == 'INDETERMINATE'
                  and routing_receiver['content_binding']['status'] == 'VALID'
                  and routing_receiver['routing_sha256'] == hashlib.sha256(saved_routing_raw).hexdigest()
                  and routing_receiver['routing']['status'] == 'RECOMPUTED'
                  and routing_receiver['routing']['records_consistent'] is True
                  and routing_receiver['routing']['source_test_result'] == 'PASS'):
              raise SystemExit('Unexpected routing receiver result')
          saved_cases = routing_receiver['routing']['cases']
          if [case['case_id'] for case in saved_cases] != [item[0] for item in expected_cases]:
              raise SystemExit('Unexpected saved routing case order')
          for case, (case_id, calls, attempts) in zip(saved_cases, expected_cases):
              totals = case['totals']
              previews = 1 if case_id in ('service-revoked-after-preview', 'user-revoked-after-preview') else 0
              if not (totals == {'attempt_count': attempts, 'preview_count': previews,
                                 'dispatch_calls': calls, 'marker_delta': calls,
                                 'reported_tool_calls': calls, 'reported_marker_count': calls}
                      and case['record_consistency'] == 'CONSISTENT'
                      and case['mismatched_fields'] == []
                      and case['reported_test_result'] == 'PASS'
                      and set(case['checks']) == {'attempt_order', 'route_digests', 'decision_records',
                                                 'preview_records', 'tool_totals'}
                      and all(value is True for value in case['checks'].values())):
                  raise SystemExit('Unexpected saved routing relations')
          if routing_summary['case_results'] != saved_cases:
              raise SystemExit('Saved routing summary changed receiver records')
          expected_limits = {
              'original_signatures': 'NOT_REVERIFIED',
              'historical_user_authorization': 'NOT_REVERIFIED',
              'historical_service_permission': 'NOT_REVERIFIED',
              'request_route_binding': 'NOT_REVERIFIED', 'nonce_use': 'NOT_REVERIFIED',
              'observation_authenticity': 'NOT_INDEPENDENTLY_ESTABLISHED',
              'route_identity': 'SYNTHETIC_LABELS_NOT_RUNTIME_MEASUREMENT',
              'tool_state': 'REPORTED_NOT_REOBSERVED', 'coverage': 'FIXED_TEN_CASE_RECORDS_ONLY',
              'source_test_result': 'REPORTED_NOT_REASSESSED', 'live_collection': 'NOT_PERFORMED',
              'observer_trust': 'SAME_CONTROLLER_PRODUCER', 'trust': 'RECEIVER_SELECTED_OUT_OF_BAND',
              'checkpoint': 'CALLER_PROTECTED_STATE', 'verification': 'REPEATABLE_NO_NONCE_CONSUMPTION',
          }
          if routing_receiver['limits'] != expected_limits:
              raise SystemExit('Routing receiver scope changed')
          for report in (routing_receiver, routing_summary):
              for key in ('report_signed', 'production_observed', 'independent_assessment',
                          'runtime_attestation', 'external_anchor_verified'):
                  if report[key] is not False:
                      raise SystemExit('Unexpected saved routing assurance claim')
              if report['control_status'] != 'NOT_ASSESSED' or report['legal_compliance'] != 'NOT_ASSESSED':
                  raise SystemExit('Unexpected saved routing assessment claim')

          def artifact_hashes(directory):
              hashes = {}
              for path in sorted(directory.rglob('*')):
                  if path.is_symlink():
                      raise SystemExit('Unexpected output link')
                  if path.is_file():
                      raw = path.read_bytes()
                      if b'-----BEGIN PRIVATE KEY-----' in raw or b'-----BEGIN ENCRYPTED PRIVATE KEY-----' in raw:
                          raise SystemExit('Private key material must not be retained')
                      hashes[str(path.relative_to(directory))] = hashlib.sha256(raw).hexdigest()
              return hashes

          artifacts = artifact_hashes(demo)
          routing_artifacts = artifact_hashes(routing_demo)
          if set(routing_artifacts) != {'delivery/service-routing-report.json', 'delivery/observation.handoff.json',
                                        'test-trust/observer-public.pem', 'test-trust/checkpoint.json',
                                        'receiver.json', 'summary.json'}:
              raise SystemExit('Unexpected retained routing files')
          source_paths = sorted(path for path in Path('examples/runtime-boundaries').iterdir()
                                if path.is_file() and path.suffix in ('.mjs', '.py', '.md'))
          source_paths.extend(Path('tools/context-observer') / name for name in
                              ('observe.py', 'authenticated.py', 'handoff.py', 'receipt_crypto.mjs', 'test_handoff.py'))
          source_paths.extend(Path('examples/execution-authorization') / name for name in
                              ('gate.mjs', 'demo.mjs', 'gate.test.mjs'))
          source_paths.extend(Path('examples/execution-authorization/service-routing') / name for name in
                              ('routing.mjs', 'demo.mjs', 'routing.test.mjs', 'README.md', 'receiver.mjs',
                               'receiver.test.mjs', 'handoff.py', 'handoff_demo.py', 'test_handoff.py', 'HANDOFF.md'))
          source_paths.append(Path('.github/workflows/runtime-handoff.yml'))
          provenance = {
              'format': 'evidect-runtime-handoff-ci/1',
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'python': sys.version.split()[0],
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'source_sha256': {str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                                for path in source_paths},
              'demo_sha256': artifacts,
              'service_routing_report_sha256': hashlib.sha256(routing_raw).hexdigest(),
              'routing_handoff_demo_sha256': routing_artifacts,
              'notice': 'First-party synthetic verification; test trust is not independent authority.'
          }
          with (result_root / 'provenance.json').open('x', encoding='utf-8') as output:
              json.dump(provenance, output, ensure_ascii=True, indent=2)
              output.write('\n')
          print('Ten synthetic routing cases, a saved ten-case routing report and eight recorded runtime cases were checked; original authority remains NOT_REVERIFIED in both receivers.')
          PY
          git diff --exit-code -- examples/runtime-boundaries examples/execution-authorization tools/context-observer .github/workflows/runtime-handoff.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: runtime-handoff-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidect-runtime-handoff-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
