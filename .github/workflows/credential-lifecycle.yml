name: Experimental credential lifecycle

on:
  pull_request:
    paths:
      - 'examples/execution-authorization/credential-lifecycle/**'
      - 'examples/execution-authorization/gate.mjs'
      - 'examples/execution-authorization/service-routing/routing.mjs'
      - 'examples/receiver-state/**'
      - 'examples/receiver-witness/**'
      - 'examples/runtime-boundaries/**'
      - 'tools/context-observer/**'
      - '.github/workflows/credential-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'examples/execution-authorization/credential-lifecycle/**'
      - 'examples/execution-authorization/gate.mjs'
      - 'examples/execution-authorization/service-routing/routing.mjs'
      - 'examples/receiver-state/**'
      - 'examples/receiver-witness/**'
      - 'examples/runtime-boundaries/**'
      - 'tools/context-observer/**'
      - '.github/workflows/credential-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test authorization, credential effects and observation boundaries
        shell: bash
        env:
          CREDENTIAL_RESULTS: ${{ runner.temp }}/evidect-credential-lifecycle
        run: |
          set -euo pipefail
          umask 077
          mkdir "$CREDENTIAL_RESULTS"
          node --test --test-reporter=tap examples/execution-authorization/gate.test.mjs 2>&1 | tee "$CREDENTIAL_RESULTS/existing-gate-tests.tap"
          node --test --test-reporter=tap examples/execution-authorization/credential-lifecycle/lifecycle.test.mjs examples/execution-authorization/credential-lifecycle/correlation.test.mjs examples/execution-authorization/credential-lifecycle/offline.test.mjs 2>&1 | tee "$CREDENTIAL_RESULTS/credential-lifecycle-tests.tap"
          node examples/execution-authorization/credential-lifecycle/demo.mjs > "$CREDENTIAL_RESULTS/report.json"
          node examples/execution-authorization/credential-lifecycle/offline-demo.mjs "$CREDENTIAL_RESULTS/offline" > "$CREDENTIAL_RESULTS/offline-generation.json"
          node examples/execution-authorization/credential-lifecycle/verify-offline.mjs "$CREDENTIAL_RESULTS/offline/evidence.json" "$CREDENTIAL_RESULTS/offline/trust.json" "$CREDENTIAL_RESULTS/offline/expectation.json" > "$CREDENTIAL_RESULTS/offline-verification.json"
      - name: Test original-input handoff, witness and saved review reports
        shell: bash
        env:
          CREDENTIAL_RESULTS: ${{ runner.temp }}/evidect-credential-lifecycle
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B examples/execution-authorization/credential-lifecycle/test_handoff.py -v 2>&1 | tee "$CREDENTIAL_RESULTS/credential-handoff-tests.log"
          python3 -I -B examples/execution-authorization/credential-lifecycle/test_witness.py -v 2>&1 | tee "$CREDENTIAL_RESULTS/credential-witness-tests.log"
          python3 -I -B examples/execution-authorization/credential-lifecycle/witness-demo.py --output "$CREDENTIAL_RESULTS/witness" > "$CREDENTIAL_RESULTS/witness-generation.json"
          python3 -I -B examples/execution-authorization/credential-lifecycle/test_review.py -v 2>&1 | tee "$CREDENTIAL_RESULTS/credential-review-tests.log"
          python3 -I -B examples/execution-authorization/credential-lifecycle/review-demo.py --output "$CREDENTIAL_RESULTS/review" > "$CREDENTIAL_RESULTS/review-generation.json"
      - name: Record the tested source and generated report
        shell: bash
        env:
          CREDENTIAL_RESULTS: ${{ runner.temp }}/evidect-credential-lifecycle
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';
          import { isDeepStrictEqual } from 'node:util';
          const directories = ['examples/execution-authorization/credential-lifecycle',
            'examples/receiver-state', 'examples/receiver-witness',
            'examples/runtime-boundaries', 'tools/context-observer'];
          const sourceFiles = directory => readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
            if (entry.name === '__pycache__') return [];
            const path = `${directory}/${entry.name}`;
            return entry.isDirectory() ? sourceFiles(path) : entry.isFile() ? [path] : [];
          });
          const paths = directories.flatMap(sourceFiles);
          paths.push('README.md', 'examples/execution-authorization/gate.mjs',
            'examples/execution-authorization/service-routing/routing.mjs',
            '.github/workflows/credential-lifecycle.yml');
          const digest = path => {
            const bytes = readFileSync(path);
            return { bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') };
          };
          const reportPath = join(process.env.CREDENTIAL_RESULTS, 'report.json');
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          if (report.format !== 'evidect-credential-lifecycle-report/2' || report.test_result !== 'PASS' || report.case_count !== 18 ||
              !Array.isArray(report.cases) || report.cases.length !== 18 ||
              !report.cases.every(item => item.test_result === 'PASS') ||
              report.overall_status !== 'INDETERMINATE' || report.witness_integrated !== false ||
              report.external_anchor_verified !== false || report.report_signed !== false ||
              report.production_observed !== false || report.independent_assessment !== false ||
              report.control_status !== 'NOT_ASSESSED' || report.legal_compliance !== 'NOT_ASSESSED') {
            throw new Error('Unexpected experimental result or assurance promotion');
          }
          const offline = JSON.parse(readFileSync(join(process.env.CREDENTIAL_RESULTS, 'offline-verification.json'), 'utf8'));
          if (offline.format !== 'evidect-credential-offline-verification/1' ||
              offline.evidence_consistency !== 'VALID' || offline.overall_status !== 'INDETERMINATE' ||
              offline.attempts.length !== 5 || offline.inventory.expected_count !== 5 ||
              !offline.attempts.every(item => item.status === 'VALID') ||
              offline.historical_authorization !== 'NOT_ASSESSED' ||
              offline.collector_current_freshness !== 'NOT_ESTABLISHED' ||
              offline.provider_log_completeness !== 'NOT_ESTABLISHED' ||
              offline.provider_observation_authenticity !== 'NOT_ESTABLISHED' ||
              offline.evidence_pack_authenticity !== 'NOT_ESTABLISHED' ||
              offline.report_signed !== false || offline.independent_assessment !== false ||
              offline.production_observed !== false || offline.witness_integrated !== false ||
              offline.external_anchor_verified !== false || offline.control_status !== 'NOT_ASSESSED' ||
              offline.legal_compliance !== 'NOT_ASSESSED') {
            throw new Error('Unexpected offline result or assurance promotion');
          }
          const generated = ['offline-generation.json', 'offline-verification.json',
            ...['evidence.json', 'trust.json', 'expectation.json', 'demo-summary.json', 'manifest.json'].map(name => `offline/${name}`)];
          const witnessDirectory = join(process.env.CREDENTIAL_RESULTS, 'witness');
          const witnessFiles = ['lifecycle-evidence.json', 'lifecycle-trust.json', 'lifecycle-expectation.json',
            'receipt-package.json', 'receipt-public.pem', 'checkpoint.json', 'witness-trust.json',
            'witness-verification.json', 'demo-summary.json', 'manifest.json'];
          const entries = readdirSync(witnessDirectory, { withFileTypes: true });
          if (entries.some(entry => !entry.isFile()) ||
              JSON.stringify(entries.map(entry => entry.name).sort()) !== JSON.stringify([...witnessFiles].sort())) {
            throw new Error('Unexpected witness demo output; publish only the fixed public files');
          }
          for (const name of witnessFiles) {
            if (readFileSync(join(witnessDirectory, name), 'utf8').includes('PRIVATE KEY')) {
              throw new Error('Private signing key in witness demo output');
            }
          }
          const witnessSummary = JSON.parse(readFileSync(join(witnessDirectory, 'demo-summary.json'), 'utf8'));
          const expectedWitnessCases = {
            'matched-adoption': 'VALID', 'older-generation': 'INVALID',
            'receiver-only-rollback': 'INVALID', 'both-stores-rollback': 'VALID',
            'same-generation-conflict': 'INVALID', 'witness-behind': 'INDETERMINATE',
            'witness-unavailable': 'INDETERMINATE', 'witness-response-replay': 'INVALID',
            'signer-revocation-rollback': 'INVALID', 'selected-input-byte-mismatch': 'INVALID',
            'offline-invalid-witness-unavailable': 'INVALID', 'context-change-rejected': 'INVALID'
          };
          if (witnessSummary.format !== 'evidect-credential-witness-demo/1' ||
              witnessSummary.test_result !== 'PASS' || witnessSummary.case_count !== 12 ||
              witnessSummary.count_scope !== 'PUBLIC_MATCHED_ADOPTION_EVIDENCE_ONLY' ||
              !Array.isArray(witnessSummary.cases) || witnessSummary.cases.length !== 12 ||
              new Set(witnessSummary.cases.map(item => item.case_id)).size !== 12 ||
              !witnessSummary.cases.every(item => item.test_result === 'PASS' &&
                item.local_status === expectedWitnessCases[item.case_id] &&
                item.overall_status === (item.local_status === 'INVALID' ? 'INVALID' : 'INDETERMINATE')) ||
              witnessSummary.overall_status !== 'INDETERMINATE' ||
              witnessSummary.report_signed !== false || witnessSummary.production_observed !== false ||
              witnessSummary.independent_assessment !== false || witnessSummary.external_anchor_verified !== false ||
              witnessSummary.witness_integrated !== true || witnessSummary.control_status !== 'NOT_ASSESSED' ||
              witnessSummary.legal_compliance !== 'NOT_ASSESSED' ||
              witnessSummary.both_stores_rollback !== 'NOT_DETECTED') {
            throw new Error('Unexpected receiver/witness scenario result or assurance promotion');
          }
          const witness = JSON.parse(readFileSync(join(witnessDirectory, 'witness-verification.json'), 'utf8'));
          const credential = witness.receiver?.receiver;
          const reverified = credential?.credential?.result;
          if (witness.format !== 'evidect-witness-receiver/1' ||
              witness.local_status !== 'VALID' || witness.overall_status !== 'INDETERMINATE' ||
              witness.witness_status !== 'VALID' || witness.witness_reason !== 'MATCHES_LIVE_WITNESS_SNAPSHOT' ||
              witness.report_signed !== false || witness.production_observed !== false ||
              witness.independent_assessment !== false || witness.control_status !== 'NOT_ASSESSED' ||
              witness.legal_compliance !== 'NOT_ASSESSED' ||
              witness.limits?.both_stores_rollback !== 'NOT_DETECTED' ||
              witness.limits?.administrative_separation !== 'NOT_ENFORCED_IN_LOCAL_EXPERIMENT' ||
              credential?.format !== 'evidect-credential-receiver/1' ||
              credential.local_status !== 'VALID' || credential.overall_status !== 'INDETERMINATE' ||
              credential.credential.status !== 'REVERIFIED' ||
              reverified?.format !== 'evidect-credential-offline-verification/1' ||
              reverified.evidence_consistency !== 'VALID' || reverified.overall_status !== 'INDETERMINATE' ||
              reverified.attempts.length !== 5 || reverified.inventory.expected_count !== 5 ||
              !reverified.attempts.every(item => item.status === 'VALID') ||
              reverified.historical_authorization !== 'NOT_ASSESSED' ||
              reverified.collector_current_freshness !== 'NOT_ESTABLISHED' ||
              reverified.provider_log_completeness !== 'NOT_ESTABLISHED' ||
              reverified.provider_observation_authenticity !== 'NOT_ESTABLISHED' ||
              reverified.evidence_pack_authenticity !== 'NOT_ESTABLISHED' ||
              reverified.report_signed !== false || reverified.independent_assessment !== false ||
              reverified.production_observed !== false || reverified.witness_integrated !== false ||
              reverified.external_anchor_verified !== false || reverified.control_status !== 'NOT_ASSESSED' ||
              reverified.legal_compliance !== 'NOT_ASSESSED') {
            throw new Error('Unexpected connected witness result or offline assurance promotion');
          }
          const witnessGenerated = ['witness-generation.json', ...witnessFiles.map(name => `witness/${name}`)];
          const reviewDirectory = join(process.env.CREDENTIAL_RESULTS, 'review');
          const reviewFiles = ['verification.json', 'review.json', 'review.html', 'review.md', 'manifest.json'];
          const expectedReviewCases = {
            'matched-witness': ['VALID', 'INDETERMINATE', 'evidect-witness-receiver/1'],
            'receiver-rollback': ['INVALID', 'INVALID', 'evidect-witness-receiver/1'],
            'witness-unavailable': ['INDETERMINATE', 'INDETERMINATE', 'evidect-witness-receiver/1'],
            'local-only': ['VALID', 'INDETERMINATE', 'evidect-stateful-receiver/1'],
            'missing-state-error': ['INDETERMINATE', 'INDETERMINATE', 'evidect-credential-receiver-error/1'],
            'inventory-difference': ['INVALID', 'INVALID', 'evidect-credential-receiver-error/1'],
            'receipt-signature-mismatch': ['INVALID', 'INVALID', 'evidect-stateful-receiver/1'],
            'expired-checkpoint': ['INDETERMINATE', 'INDETERMINATE', 'evidect-stateful-receiver/1'],
            'uninspected-inventory': ['INVALID', 'INVALID', 'evidect-credential-receiver-error/1'],
            'unattributed-provider-record': ['INDETERMINATE', 'INDETERMINATE', 'evidect-credential-receiver-error/1']
          };
          const reviewEntries = readdirSync(reviewDirectory, { withFileTypes: true });
          const expectedReviewEntries = [...Object.keys(expectedReviewCases), 'demo-summary.json'].sort();
          if (JSON.stringify(reviewEntries.map(entry => entry.name).sort()) !== JSON.stringify(expectedReviewEntries) ||
              reviewEntries.some(entry => entry.name === 'demo-summary.json' ? !entry.isFile() : !entry.isDirectory())) {
            throw new Error('Unexpected saved-review demo output');
          }
          const reviewSummary = JSON.parse(readFileSync(join(reviewDirectory, 'demo-summary.json'), 'utf8'));
          if (reviewSummary.format !== 'evidect-credential-review-demo/1' || reviewSummary.test_result !== 'PASS' ||
              reviewSummary.case_count !== 10 || !Array.isArray(reviewSummary.cases) || reviewSummary.cases.length !== 10 ||
              new Set(reviewSummary.cases.map(item => item.case_id)).size !== 10 ||
              reviewSummary.overall_status !== 'INDETERMINATE' || reviewSummary.report_signed !== false ||
              reviewSummary.production_observed !== false || reviewSummary.independent_assessment !== false ||
              reviewSummary.external_anchor_verified !== false || reviewSummary.control_status !== 'NOT_ASSESSED' ||
              reviewSummary.legal_compliance !== 'NOT_ASSESSED') {
            throw new Error('Unexpected saved-review scenario result or assurance promotion');
          }
          for (const item of reviewSummary.cases) {
            const expected = expectedReviewCases[item.case_id];
            if (!expected || item.directory !== item.case_id || item.test_result !== 'PASS' ||
                item.local_status !== expected[0] || item.overall_status !== expected[1]) {
              throw new Error('Unexpected saved-review case');
            }
            const directory = join(reviewDirectory, item.directory);
            const files = readdirSync(directory, { withFileTypes: true });
            if (files.some(entry => !entry.isFile()) ||
                JSON.stringify(files.map(entry => entry.name).sort()) !== JSON.stringify([...reviewFiles].sort())) {
              throw new Error('Saved review must contain exactly the five report files');
            }
            const verification = JSON.parse(readFileSync(join(directory, 'verification.json'), 'utf8'));
            const view = JSON.parse(readFileSync(join(directory, 'review.json'), 'utf8'));
            const original = digest(join(directory, 'verification.json'));
            if (verification.format !== expected[2] || verification.local_status !== expected[0] ||
                verification.overall_status !== expected[1] || view.format !== 'evidect-credential-review/2' ||
                view.local_status !== verification.local_status || view.overall_status !== verification.overall_status ||
                view.mode !== item.mode || view.source?.format !== verification.format ||
                view.source?.sha256 !== original.sha256 || view.source?.bytes !== original.bytes ||
                view.report_authenticity !== 'UNSIGNED_DERIVED_VIEW_NOT_EVIDENCE' ||
                view.report_signed !== false || view.production_observed !== false ||
                view.independent_assessment !== false || view.external_anchor_verified !== false ||
                view.control_status !== 'NOT_ASSESSED' || view.legal_compliance !== 'NOT_ASSESSED' ||
                view.historical_authorization !== 'NOT_ASSESSED' || view.collector_current_freshness !== 'NOT_ESTABLISHED' ||
                view.witness_current_freshness !== 'NOT_ESTABLISHED' ||
                view.provider_observation_authenticity !== 'NOT_ESTABLISHED' ||
                view.provider_log_completeness !== 'NOT_ESTABLISHED' || view.both_stores_rollback !== 'NOT_DETECTED') {
              throw new Error('Saved review changed the original verdict or assurance limits');
            }
            const state = verification.format === 'evidect-witness-receiver/1' ? verification.receiver
              : verification.format === 'evidect-stateful-receiver/1' ? verification : null;
            const adapter = state ? state.receiver : verification.receiver;
            const originalOffline = adapter?.credential?.status === 'REVERIFIED' ? adapter.credential.result : null;
            const expectedCredentialChecks = originalOffline ? ['context_binding', 'trust_material']
              .map(name => ({ name, ...originalOffline[name] })) : null;
            const expectedReceiptChecks = adapter?.handoff?.authentication?.checks ?? null;
            const comparedInventoryReasons = new Set(['EXPECTED_REQUEST_INVENTORY_MATCH',
              'EXPECTED_REQUEST_EVIDENCE_MISSING', 'UNEXPECTED_SIGNED_REQUEST']);
            const computedProviderReasons = new Set(['PROVIDER_CORRELATION_CONTRADICTION',
              'MATCHING_OBSERVATION_MISSING', 'UNATTRIBUTED_PROVIDER_RECORDS', 'SCOPED_PROVIDER_RECORDS_CONSISTENT']);
            let expectedInventory = null, expectedCorrelation = null;
            if (originalOffline) {
              const originalInventory = originalOffline.inventory;
              const assessment = comparedInventoryReasons.has(originalInventory.reason) ? 'COMPARED'
                : originalInventory.reason === 'RECEIVER_EXPECTATION_UNAVAILABLE' ? 'EXPECTATION_UNAVAILABLE' : 'NOT_CHECKED';
              expectedInventory = { ...originalInventory, assessment };
              if (assessment !== 'COMPARED') Object.assign(expectedInventory,
                { expected_count: null, missing_request_digests: null, unexpected_request_digests: null });
              if (assessment === 'NOT_CHECKED') expectedInventory.supplied_unique_count = null;
              const correlation = originalOffline.provider_correlation;
              expectedCorrelation = { status: correlation.status, reason: correlation.reason,
                unattributed_provider_request_ids: computedProviderReasons.has(correlation.reason) &&
                  Array.isArray(correlation.unattributedProviderRequestIds) ? correlation.unattributedProviderRequestIds : null };
            }
            if (!isDeepStrictEqual(view.credential_checks, expectedCredentialChecks) ||
                !isDeepStrictEqual(view.receipt_checks, expectedReceiptChecks) ||
                !isDeepStrictEqual(view.inventory, expectedInventory) ||
                !isDeepStrictEqual(view.provider_correlation, expectedCorrelation)) {
              throw new Error('Saved review changed or omitted original diagnostics or unknown states');
            }
            const manifest = JSON.parse(readFileSync(join(directory, 'manifest.json'), 'utf8'));
            const manifestFiles = reviewFiles.filter(name => name !== 'manifest.json');
            if (manifest.format !== 'evidect-credential-review-manifest/1' || manifest.report_signed !== false ||
                manifest.source_format !== verification.format || manifest.source_sha256 !== original.sha256 ||
                manifest.local_status !== verification.local_status || manifest.overall_status !== verification.overall_status ||
                JSON.stringify(Object.keys(manifest.files).sort()) !== JSON.stringify([...manifestFiles].sort()) ||
                !manifestFiles.every(name => {
                  const actual = digest(join(directory, name));
                  return manifest.files[name].sha256 === actual.sha256 && manifest.files[name].bytes === actual.bytes;
                })) {
              throw new Error('Saved-review manifest does not identify the generated files');
            }
            for (const name of ['review.html', 'review.md']) {
              const rendered = readFileSync(join(directory, name), 'utf8');
              if (!rendered.includes('総合判定') || !rendered.includes(verification.overall_status)) {
                throw new Error('Saved review omits the outer overall verdict');
              }
              const diagnosticReasons = [...(view.credential_checks ?? []), ...(view.receipt_checks ?? [])]
                .map(check => check.reason);
              if (view.provider_correlation) diagnosticReasons.push(view.provider_correlation.reason);
              const diagnosticIds = [...(view.inventory?.missing_request_digests ?? []),
                ...(view.inventory?.unexpected_request_digests ?? []),
                ...(view.provider_correlation?.unattributed_provider_request_ids ?? [])];
              if (![...diagnosticReasons, ...diagnosticIds].every(value => rendered.includes(value))) {
                throw new Error('Human-readable review omits diagnostic reasons or comparison identifiers');
              }
            }
          }
          const reviewGenerated = ['review-generation.json', 'review/demo-summary.json',
            ...Object.keys(expectedReviewCases).flatMap(id => reviewFiles.map(name => `review/${id}/${name}`))];
          const inventory = {
            format: 'evidect-credential-ci-inventory/4',
            tested_commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            node: process.version,
            python: execFileSync('python3', ['--version'], { encoding: 'utf8' }).trim(),
            platform: process.platform,
            sources: Object.fromEntries(paths.sort().map(path => [path, digest(path)])),
            report: digest(reportPath),
            offline: Object.fromEntries(generated.map(name => [name, digest(join(process.env.CREDENTIAL_RESULTS, name))])),
            witness: Object.fromEntries(witnessGenerated.map(name => [name, digest(join(process.env.CREDENTIAL_RESULTS, name))])),
            review: Object.fromEntries(reviewGenerated.map(name => [name, digest(join(process.env.CREDENTIAL_RESULTS, name))])),
            notice: 'Unsigned CI inventory. It identifies this run; it is not independent evidence or certification.'
          };
          writeFileSync(join(process.env.CREDENTIAL_RESULTS, 'source-inventory.json'), JSON.stringify(inventory, null, 2) + '\n');
          JS
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: credential-lifecycle-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidect-credential-lifecycle/
          if-no-files-found: warn
          retention-days: 14
