name: Experimental receiver state witness

on:
  pull_request:
    paths:
      - 'examples/receiver-witness/**'
      - 'examples/receiver-state/**'
      - 'examples/runtime-boundaries/**'
      - 'examples/execution-authorization/**'
      - 'tools/context-observer/**'
      - '.github/workflows/receiver-witness.yml'
  push:
    branches: [main]
    paths:
      - 'examples/receiver-witness/**'
      - 'examples/receiver-state/**'
      - 'examples/runtime-boundaries/**'
      - 'examples/execution-authorization/**'
      - 'tools/context-observer/**'
      - '.github/workflows/receiver-witness.yml'

permissions:
  contents: read

concurrency:
  group: receiver-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  witness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test signed witness contracts and separate-store integration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B examples/receiver-witness/test_witness.py -v
          python3 -I -B examples/receiver-witness/test_integration.py -v
      - name: Recheck all existing state and handoff contracts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B examples/receiver-state/test_state.py -v
          python3 -I -B examples/receiver-state/test_integration.py -v
          node --test examples/execution-authorization/gate.test.mjs
          node --test examples/execution-authorization/service-routing/routing.test.mjs
          node --test examples/execution-authorization/service-routing/receiver.test.mjs
          node --test examples/runtime-boundaries/boundary.test.mjs
          python3 -I -B tools/context-observer/test_handoff.py -v
          python3 -I -B examples/runtime-boundaries/test_handoff.py -v
          python3 -I -B examples/execution-authorization/service-routing/test_handoff.py -v
