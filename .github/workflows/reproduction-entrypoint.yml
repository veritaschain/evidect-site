name: Public reproduction entrypoint
on:
  pull_request:
    paths:
      - 'methodology/**'
      - 'notices/**'
      - 'support/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'index.html'
      - 'privacy/**'
      - 'docs/OBSERVATION_REPRODUCTION.md'
      - 'tests/**'
      - 'seo.json'
      - 'sitemap.xml'
      - '.github/workflows/reproduction-entrypoint.yml'
  push:
    branches: [main]
    paths:
      - 'methodology/**'
      - 'notices/**'
      - 'support/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'index.html'
      - 'privacy/**'
      - 'docs/OBSERVATION_REPRODUCTION.md'
      - 'tests/**'
      - 'seo.json'
      - 'sitemap.xml'
      - '.github/workflows/reproduction-entrypoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate new entrypoint and existing site regressions
        run: python3 -I -B -m unittest discover -s tests -v
      - name: Validate analytics consent boundaries
        run: node --test tests/analytics.test.cjs
