name: Offline observation handoff
on:
  pull_request:
    paths:
      - 'tools/context-observer/**'
      - '.github/workflows/context-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'tools/context-observer/**'
      - '.github/workflows/context-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test receiver-side verification and rejection paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff-results
          git rev-parse HEAD > handoff-results/SOURCE_COMMIT.txt
          python3 --version > handoff-results/ENVIRONMENT.txt
          node --version >> handoff-results/ENVIRONMENT.txt
          python3 -I -B tools/context-observer/test_handoff.py -v 2>&1 | tee handoff-results/handoff.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: observation-handoff-${{ matrix.os }}-${{ github.run_id }}
          path: handoff-results/
          if-no-files-found: error
          retention-days: 30
