name: Experimental execution authorization
on:
  pull_request:
    paths:
      - 'examples/execution-authorization/**'
      - 'tools/context-observer/**'
      - 'examples/control-revalidation/**'
      - 'tests/**'
      - '.github/workflows/execution-authorization.yml'
  push:
    branches: [main]
    paths:
      - 'examples/execution-authorization/**'
      - 'tools/context-observer/**'
      - 'examples/control-revalidation/**'
      - 'tests/**'
      - '.github/workflows/execution-authorization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authorization:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test actual gate effects and existing regressions
        shell: bash
        env:
          RESULTS: ${{ runner.temp }}/evidect-authorization-results
        run: |
          set -euo pipefail
          mkdir -m 700 "$RESULTS"
          { git rev-parse HEAD; node --version; python3 --version; } > "$RESULTS/environment.txt"
          node --test examples/execution-authorization/gate.test.mjs 2>&1 | tee "$RESULTS/authorization-tests.tap"
          node --test examples/execution-authorization/durable-replay.test.mjs 2>&1 | tee "$RESULTS/durable-replay-tests.tap"
          node --test examples/control-revalidation/demo.test.mjs
          python3 -I -B tools/context-observer/test_observe.py -v
          python3 -I -B -m unittest discover -s tests -v
      - name: Observe the generated synthetic result with the existing collector
        shell: bash
        env:
          RESULTS: ${{ runner.temp }}/evidect-authorization-results
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RESULTS/synthetic"
          node examples/execution-authorization/demo.mjs > "$RESULTS/synthetic/authorization.json"
          node examples/execution-authorization/durable-demo.mjs > "$RESULTS/synthetic/durable-authorization.json"
          python3 -I -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RESULTS'])
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          manifest = {'format': 'evidect-context-selection/1', 'context': {
              'service': 'authorization-fixture', 'environment': 'synthetic', 'release': commit,
              'scope': 'two-synthetic-results', 'policy_revision': 'experimental-v1', 'generation': 1},
              'files': ['authorization.json', 'durable-authorization.json']}
          (root / 'selection.json').write_text(json.dumps(manifest))
          sources = {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(Path('examples/execution-authorization').glob('*')) if p.is_file()}
          (root / 'source-hashes.json').write_text(json.dumps(sources, indent=2))
          PY
          python3 -I -B tools/context-observer/observe.py --root "$RESULTS/synthetic" --manifest "$RESULTS/selection.json" --output "$RESULTS/observation.json"
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RESULTS'])
          report = json.loads((root / 'synthetic/authorization.json').read_text())
          receipt = json.loads((root / 'observation.json').read_text())
          durable = json.loads((root / 'synthetic/durable-authorization.json').read_text())
          ok = (report['test_result'] == 'PASS' and len(report['cases']) == 18
                and all(c['observed_tool_calls_delta'] == 0 for c in report['cases'] if c['authorization'] == 'DENY')
                and report['production_observed'] is False and report['report_signed'] is False
                and durable['test_result'] == 'PASS' and len(durable['cases']) == 4
                and durable['cases'][1]['total_observed_tool_calls'] == 1
                and durable['database_rollback_protected'] is False
                and durable['production_observed'] is False and durable['report_signed'] is False
                and durable['control_status'] == 'NOT_ASSESSED'
                and durable['legal_compliance'] == 'NOT_ASSESSED'
                and receipt['comparison']['state'] == 'BASELINE_REQUIRED'
                and receipt['comparison']['control_status'] == 'NOT_ASSESSED'
                and receipt['limits']['production_observed'] is False)
          if not ok: raise SystemExit('Unexpected observation or assurance state')
          print('18 in-process cases and 4 actual-process scenarios observed; controls/legal NOT_ASSESSED')
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: authorization-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidect-authorization-results/
          if-no-files-found: warn
          retention-days: 30
