name: Retention evidence intake

on:
  push:
    paths:
      - 'examples/retention-evidence-intake/**'
      - '.github/workflows/retention-evidence-intake.yml'
  pull_request:
    paths:
      - 'examples/retention-evidence-intake/**'
      - '.github/workflows/retention-evidence-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      EVIDECT_VAP_SOURCE: ${{ github.workspace }}/.retention-upstream
    defaults:
      run:
        working-directory: examples/retention-evidence-intake
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Obtain the separately pinned upstream verifier source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: veritaschain/vap-spec
          ref: 62d15f1b8d3c46a1704acb7c0d5631622e1a5608
          path: .retention-upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare receiver dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Receiver trust, context, time and isolation tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Execute and recheck saved synthetic intake frames
        run: python -I -B demo.py --vap-source "$EVIDECT_VAP_SOURCE" --output generated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retention-intake-python-${{ matrix.python-version }}
          path: |
            examples/retention-evidence-intake/generated/summary.json
            examples/retention-evidence-intake/generated/frames/
          if-no-files-found: error
          retention-days: 30
