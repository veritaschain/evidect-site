name: Retention evidence intake

on:
  push:
    paths:
      - 'examples/retention-evidence-intake/**'
      - '.github/workflows/retention-evidence-intake.yml'
  pull_request:
    paths:
      - 'examples/retention-evidence-intake/**'
      - '.github/workflows/retention-evidence-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      EVIDECT_VAP_SOURCE: ${{ github.workspace }}/.retention-upstream
    defaults:
      run:
        working-directory: examples/retention-evidence-intake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Obtain the separately pinned upstream verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: veritaschain/vap-spec
          ref: 62d15f1b8d3c46a1704acb7c0d5631622e1a5608
          path: .retention-upstream
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare receiver dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Receiver trust, context, time and isolation tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Execute and recheck saved synthetic intake frames
        run: python -I -B demo.py --vap-source "$EVIDECT_VAP_SOURCE" --output generated
      - name: Execute and recheck saved synthetic follow-up frames
        run: python -I -B followup_demo.py --vap-source "$EVIDECT_VAP_SOURCE" --output generated-followup
      - name: Execute and recheck the complete synthetic review workflow
        run: python -I -B workflow_demo.py --vap-source "$EVIDECT_VAP_SOURCE" --output generated-workflow
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: retention-intake-python-${{ matrix.python-version }}
          path: |
            examples/retention-evidence-intake/generated/summary.json
            examples/retention-evidence-intake/generated/frames/
            examples/retention-evidence-intake/generated-followup/summary.json
            examples/retention-evidence-intake/generated-followup/frames/
            examples/retention-evidence-intake/generated-workflow/**
          if-no-files-found: error
          retention-days: 30
